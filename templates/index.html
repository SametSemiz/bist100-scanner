<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BIST100 BBAWE Tarayıcı</title>
    <meta name="description" content="BIST100 hisseleri için otomatik Bollinger Band Awesome (BBAWE) squeeze tarayıcı. Mavi bulut formasyonundaki hisseleri anında bulun.">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
    <div class="app-wrapper">
        <!-- Ana İçerik -->
        <div class="main-content">
            <div class="glass-container position-relative">

                <header class="text-center mb-4 pt-4 position-relative">
                    <h1 class="app-title gradient-text mb-1"><i class="fas fa-satellite-dish me-2"></i>BIST100 Tarayıcı</h1>
                    <p class="text-muted-custom mb-0 subtitle">Otomatik BBAWE Squeeze Tarama Sistemi</p>
                </header>

                <!-- Özel Hisse Tarama Alanı -->
                <div class="row justify-content-center mb-3">
                    <div class="col-12 col-md-6 col-lg-5">
                        <div class="control-panel p-2 p-md-3 rounded-4 shadow">
                            <label class="form-label text-light fw-semibold mb-1" style="font-size: 0.8rem;">Özel Hisse Arama</label>
                            <div class="d-flex gap-2 mb-2">
                                <input type="text" id="customSearchInput" class="form-control form-control-sm bg-dark text-light border-secondary text-uppercase" placeholder="Hisse (Örn: THYAO)" list="stockList">
                                <button class="btn btn-sm btn-outline-info px-3" id="addCustomStockBtn"><i class="fas fa-plus"></i></button>
                            </div>
                            <div id="customStockTags" class="d-flex flex-wrap gap-1 mb-2 empty">
                                <!-- Seçilen hisseler buraya tag olarak eklenecek -->
                            </div>
                            <button class="btn btn-sm btn-primary w-100 disabled" id="customScanBtn">
                                <i class="fas fa-search me-1"></i>Özel Tarama Başlat
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Zaman Aralığı Seçici -->
                <div class="row justify-content-center mb-3">
                    <div class="col-12 col-md-8">
                        <div class="control-panel p-3 p-md-4 rounded-4 shadow text-center">
                            <label class="form-label text-light fw-semibold mb-2 small">Zaman Aralığı</label>
                            <div class="timeframe-selector d-flex gap-2 mb-3">
                                <input type="radio" class="btn-check" name="timeframe" id="tf_1d" value="1d" autocomplete="off" checked>
                                <label class="btn btn-outline-primary flex-fill" for="tf_1d">1 Gün</label>

                                <input type="radio" class="btn-check" name="timeframe" id="tf_4h" value="4h" autocomplete="off">
                                <label class="btn btn-outline-primary flex-fill" for="tf_4h">4 Saat</label>

                                <input type="radio" class="btn-check" name="timeframe" id="tf_2h" value="2h" autocomplete="off">
                                <label class="btn btn-outline-primary flex-fill" for="tf_2h">2 Saat</label>

                                <input type="radio" class="btn-check" name="timeframe" id="tf_1h" value="1h" autocomplete="off">
                                <label class="btn btn-outline-primary flex-fill" for="tf_1h">1 Saat</label>
                            </div>
                            
                            <!-- Güncelleme Bölümü -->
                            <div class="update-section">
                                <button id="refreshBtn" class="btn refresh-btn px-4 py-2 rounded-pill">
                                    <span class="spinner-border spinner-border-sm d-none me-2" id="refreshSpinner" role="status"></span>
                                    <i class="fas fa-sync-alt me-2" id="refreshIcon"></i>
                                    <span id="refreshText">Taramayı Başlat</span>
                                </button>
                                <div id="refreshProgress" class="d-none mt-2"></div>
                                <div id="lastUpdateTime" class="last-update-text mt-2">
                                    <i class="fas fa-clock me-1"></i>Güncelleme bilgisi yükleniyor...
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Yükleniyor durumu -->
                <div id="loadingArea" class="text-center py-5">
                    <div class="spinner-grow text-info" role="status" style="width: 3rem; height: 3rem;">
                        <span class="visually-hidden">Yükleniyor...</span>
                    </div>
                    <p class="text-muted-custom mt-3 fs-5">Veriler yükleniyor...</p>
                </div>

                <!-- Sonuçlar -->
                <div id="resultsArea" class="d-none">
                    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
                        <h3 class="results-title m-0"><i class="fas fa-cloud text-info me-2"></i>Mavi Bulutta Olan Hisseler</h3>
                        <span class="badge bg-primary fs-6" id="scanStats"></span>
                    </div>
                    
                    <div class="row g-2 g-md-3" id="stockCards">
                        <!-- Sonuçlar JS ile yüklenecek -->
                    </div>
                </div>

                <!-- Düşen Hisseler -->
                <div id="droppedArea" class="d-none mt-5">
                    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
                        <h3 class="results-title m-0" style="color: #f87171;"><i class="fas fa-arrow-trend-down me-2"></i>Listeden Düşenler (Son 24 Saat)</h3>
                        <span class="badge bg-danger fs-6" id="droppedStats"></span>
                    </div>
                    <div class="row g-2 g-md-3" id="droppedCards">
                        <!-- Sonuçlar JS ile yüklenecek -->
                    </div>
                </div>
            </div>
        </div>

        <!-- Favoriler Sidebar (Desktop: sağ panel, Mobil: alt panel / bottom sheet) -->
        <div class="favorites-sidebar" id="favoritesSidebar">
            <div class="favorites-header">
                <h4 class="m-0"><i class="fas fa-star text-warning me-2"></i>Takip Listesi</h4>
                <div class="d-flex align-items-center gap-2">
                    <span class="badge bg-secondary" id="favCount">0</span>
                    <!-- Desktop kapatma butonu -->
                    <button class="fav-close-btn d-none d-lg-block" id="favDesktopToggleBtn" title="Takip Listesini Gizle">
                        <i class="fas fa-arrow-right"></i>
                    </button>
                    <!-- Mobilde kapatma butonu -->
                    <button class="fav-close-btn d-lg-none" id="favCloseBtn">
                        <i class="fas fa-chevron-down"></i>
                    </button>
                </div>
            </div>
            
            <div class="p-3 border-bottom border-secondary" style="background: rgba(15, 23, 42, 0.95);">
                <div class="input-group input-group-sm">
                    <span class="input-group-text bg-dark border-secondary text-light"><i class="fas fa-search"></i></span>
                    <input type="text" id="favSearchInput" class="form-control bg-dark border-secondary text-light text-uppercase" placeholder="Hisse ara..." list="stockList">
                    <button class="btn btn-outline-success" id="favAddBtn"><i class="fas fa-plus"></i></button>
                </div>
            </div>

            <!-- Mobilde sürükleme çubuğu -->
            <div class="drag-handle d-lg-none">
                <div class="drag-bar"></div>
            </div>
            <div id="favoritesContainer" class="favorites-list">
                <div class="favorites-empty">
                    <i class="fas fa-heart-circle-plus fa-2x mb-3 text-muted-custom"></i>
                    <p class="text-muted-custom mb-0">Henüz hisse eklenmedi</p>
                    <small class="text-muted-custom">Kartlardaki ⭐ ile ekleyin</small>
                </div>
            </div>
        </div>

        <!-- Desktop Favoriler Toggle (kapalıyken açmak için) -->
        <button class="desktop-fav-toggle" id="desktopFavToggleOpen" title="Takip Listesini Aç" style="display: none;">
            <i class="fas fa-list-ul"></i>
        </button>

        <!-- Mobil Favoriler Toggle (FAB butonu) -->
        <button class="favorites-toggle d-lg-none" id="favToggleBtn" title="Takip Listesi">
            <i class="fas fa-star"></i>
            <span class="fav-toggle-count" id="favToggleCount">0</span>
        </button>

        <!-- Overlay (mobil sidebar için) -->
    </div>

    <!-- Ortak Datalist -->
    <datalist id="stockList"></datalist>


    <!-- PWA Install -->
    <div class="text-center d-md-none" style="position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%); z-index: 90;">
        <button id="installPwaBtn" class="btn btn-outline-info rounded-pill px-4 py-2 d-none shadow-sm">
            <i class="fas fa-download me-2"></i>Uygulama Olarak İndir
        </button>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <script src="{{ url_for('static', filename='app.js') }}"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register("{{ url_for('static', filename='sw.js') }}");
        }
    </script>
</body>
</html>
